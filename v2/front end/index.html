<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>roadworks.info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="map"></div>

    <a
      href="mailto:contact@roadworks.info?subject=Advertising%20Enquiry"
      class="sponsor-banner-link"
    >
      <div class="sponsor-banner">
        If you would like to advertise your service here,<br />
        please contact us at <br />
        <span class="email-text">contact@roadworks.info</span>
      </div>
    </a>
    <div id="loading">Loading road works…</div>

    <!-- SEARCH BAR UNDER TITLE -->
    <div class="top-search">
      <input
        type="text"
        id="searchInput"
        placeholder="Search road, town, or reference…"
      />
      <div id="searchResults"></div>
    </div>

    <div class="sidebar">
      <!-- DATE FILTER CONTAINER -->
      <div class="date-filter-container">
        <!-- The collapsible content panel -->
        <div id="date-filter-panel">
          <div class="date-filter">
            <label><strong>Select date range below:</strong></label>

            <!-- Quick buttons -->
            <div class="quick-dates">
              <button id="quickLastWeek">Last Week</button>
              <button id="quickToday">Today</button>
              <button id="quickThisWeek">This Week</button>
              <button id="quickThisMonth">This Month</button>
            </div>
            <!-- Actual date inputs -->
            <div class="date-input-row">
              <input type="date" id="dateFrom" />
              <input type="date" id="dateTo" />
            </div>
          </div>
        </div>

        <div class="date-filter-footer">
          <div id="date-filter-toggle">▼</div>
        </div>
      </div>

      <!-- WORKS CALLOUT -->

      <div class="callout" id="info-callout">
        <div id="callout-toggle">▶</div>

        <div id="sidebar-callout-details" class="callout-body"></div>
      </div>
    </div>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Your JS -->
    <script src="app.js"></script>
  </body>
</html>
