<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>roadworks.info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="map"></div>

    <div class="title-banner">roadworks.info</div>
    <div id="loading">Loading road works…</div>
    

    </div>

    <div class="sidebar">
      <div class="search-bar">
        <input type="text" placeholder="Search road, town, or reference…" />
      </div>

      <div class="sidebar">
    <div class="date-filter">
      <label><strong>Date range:</strong></label>
      <input type="date" id="dateFrom" />
      <input type="date" id="dateTo" />
    </div>
 <div id="status-bar"></div>
      <div class="callout" id="info-callout">
        <div class="callout-header">
          <span>Roadworks overview</span>
          <span id="callout-toggle">▼</span>
        </div>

        <div class="callout-body" id="sidebar-callout-details">
          Live and planned roadworks across the UK. Click on a pin to see
          details.
        </div>
      </div>
    </div>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Your JS -->
    <script src="app.js"></script>
  </body>
</html>
