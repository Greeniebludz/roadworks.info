<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>roadworks.info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="map"></div>

    <div class="title-banner">roadworks.info</div>
    <div class="sponsor-banner">
      Sponsored by [If you would like to sponsor this project, please contact
      us]
    </div>
    <div id="loading">Loading road works…</div>

    <!-- SEARCH BAR UNDER TITLE -->
    <div class="top-search">
      <input
        type="text"
        id="searchInput"
        placeholder="Search road, town, or reference…"
      />
      <div id="searchResults"></div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <!-- DATE FILTER -->
      <div class="date-filter-container">
        <div class="date-filter">
          <label><strong>Select date range below:</strong></label>

          <!-- Quick buttons -->
          <div class="quick-dates">
            .
            <button id="quickLastWeek">Last Week</button>
            <button id="quickToday">Today</button>
            <button id="quickThisWeek">This Week</button>
          </div>
          <!-- Actual date inputs -->
          <div class="date-input-row">
            <input type="date" id="dateFrom" />
            <input type="date" id="dateTo" />
          </div>
        </div>
      </div>
      <!-- Callout -->
      <div id="status-bar"></div>

      <div class="callout" id="info-callout">
        <div class="callout-header">
          <span>Roadworks overview</span>
          <span id="callout-toggle">▼</span>
        </div>

        <div class="callout-body">
          <!-- DYNAMIC CONTENT -->
          <div id="sidebar-callout-details">
            Live and planned roadworks across the UK. Click on a pin to see
            details.
          </div>
        </div>
      </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Your JS -->
    <script src="app.js"></script>
  </body>
</html>
