<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Roadworks Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="mapContainer">
    <!-- SEARCH BAR -->
    <div id="searchBar">
      <input type="text" id="searchInput" placeholder="Search roadworks or locations…" />
    </div>

    <!-- INFO PANEL (left callout) -->
    <div id="infoPanel" class="hidden">
      <div id="infoCollapseHandle">❯</div>
    </div>

    <!-- LAYERS BUTTON -->
    <div id="layersButton">Layers</div>

    <!-- LAYERS PANEL -->
    <div id="layersPanel" class="hidden">
      <label>
        <input type="checkbox" id="showExtents" checked />
        Show full extents
      </label>
    </div>

    <!-- DATE FILTERS -->
    <div id="dateFilters">
      <label>
        <strong>Start date:</strong>
        <input type="date" id="filterStart" />
      </label>

      <label>
        <strong>End date:</strong>
        <input type="date" id="filterEnd" />
      </label>

      <button id="applyDateFilter">Apply</button>

      <div id="quickButtons">
        <button data-range="last14">Last 2 Weeks</button>
        <button data-range="today">Today</button>
        <button data-range="next7">Next Week</button>
        <button data-range="next30">Next Month</button>
      </div>
    </div>

    <!-- BACK LINK -->
    <a href="https://roadworks.info" id="backLink">Roadworks.info</a>

    <!-- MAP -->
    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
