<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadworks Map Viewer</title>

  <!-- Leaflet Core CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Leaflet Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

  <!-- Custom CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    #gl-legend {
  position: absolute;
  bottom: 20px;
  left: 20px;
  background: white;
  padding: 12px 16px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-family: Arial, sans-serif;
  font-size: 14px;
  width: 180px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.legend-section {
  margin-bottom: 12px;
}

.legend-section h4 {
  margin: 0 0 6px;
  font-size: 14px;
  font-weight: bold;
}

.legend-row {
  display: flex;
  align-items: center;
  margin-bottom: 4px;
}

.legend-colour {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  margin-right: 8px;
  border: 1px solid #ccc;
}

.legend-icon {
  width: 24px;
  height: 24px;
  margin-right: 6px;
}

    #map {
      width: 100%;
      height: 500px;
      background: #ddd;
      border: 2px solid #00A651;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    #controls {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      background: #00A651;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #008f45;
    }

    .dot-icon {
      width: 8px;
      height: 8px;
      background: #333;
      border-radius: 50%;
    }
  </style>
</head>

<body>

  <header>
    <h1>Roadworks Map Viewer</h1>
  </header>

  <div id="map"></div>

  <div id="controls">
    <button id="loadDataBtn">Reload Data</button>

    <select id="statusFilter">
      <option value="">All Statuses</option>
      <option value="Works in progress">Works in progress</option>
      <option value="Works completed">Works completed</option>
    </select>

    <input type="date" id="startDate">
    <input type="date" id="endDate">
  </div>
<!-- ⭐ LEGEND -->
<div id="gl-legend">
  <h3>Legend</h3>

  <div class="legend-section">
    <h4>Delay Severity</h4>
    <div class="legend-row">
      <span class="legend-colour" style="background:#00C853"></span> Minimal
    </div>
    <div class="legend-row">
      <span class="legend-colour" style="background:#FFB300"></span> Moderate
    </div>
    <div class="legend-row">
      <span class="legend-colour" style="background:#D50000"></span> Severe
    </div>
    <div class="legend-row">
      <span class="legend-colour" style="background:#9E9E9E"></span> No Delay
    </div>
  </div>

  <div class="legend-section">
    <h4>Traffic Management</h4>
    <div id="tm-legend"></div>
  </div>

  <div class="legend-section">
    <h4>Utility Provider</h4>
    <div id="utility-legend"></div>
  </div>
</div>

  <pre id="debug"></pre>

  <!-- Leaflet Core JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Leaflet Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <!-- Leaflet MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <!-- Map + Geocoder -->
  <script>
    const map = L.map('map').setView([51.4, -0.7], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    L.Control.geocoder({
      defaultMarkGeocode: true
    })
    .on('markgeocode', function(e) {
      map.fitBounds(e.geocode.bbox);
    })
    .addTo(map);
  </script>

  <!-- External JS -->
  <script src="script.js"></script>

</body>
</html>
