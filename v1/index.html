<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Roadworks Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- SEARCH BAR -->
  <div id="searchBar">
    <input type="text" id="searchInput" placeholder="Search roadworks or locations…" />
  </div>

  <!-- INFO PANEL (left callout) -->
  <div id="infoPanel" class="hidden"></div>

  <!-- LAYERS BUTTON -->
  <div id="layersButton">Layers</div>

  <!-- LAYERS PANEL -->
  <div id="layersPanel" class="hidden">
    <label>
      <input type="checkbox" id="showExtents" checked />
      Show full extents
    </label>
  </div>

  <!-- BACK LINK -->
  <a href="https://roadworks.info" id="backLink">Roadworks.info</a>

  <!-- MAP -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Custom JS -->
  <script src="script.js"></script>

</body>
</html>
