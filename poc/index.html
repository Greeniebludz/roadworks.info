<!DOCTYPE html>
<html lang="en">
<head>
  <!-- SUBJECT: Page Metadata -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadworks Map Viewer</title>

  <!-- SUBJECT: Leaflet Core CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- SUBJECT: Leaflet Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <!-- SUBJECT: Your Custom CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    #map {
      width: 100%;
      height: 500px;
      background: #ddd;
      border: 2px solid #00A651;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    #controls {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      background: #00A651;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #008f45;
    }

    #output {
      background: #fff;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    /* SUBJECT: Dot Icon Style */
    .dot-icon {
      width: 8px;
      height: 8px;
      background: #333;
      border-radius: 50%;
    }
  </style>
</head>

<body>

  <!-- SUBJECT: Page Header -->
  <header>
    <h1>Roadworks Map Viewer</h1>
  </header>

  <!-- SUBJECT: Map Container -->
  <div id="map"></div>

  <!-- SUBJECT: Controls -->
  <div id="controls">
    <button id="loadDataBtn">Reload Data</button>
    <select id="statusFilter">
      <option value="">All Statuses</option>
      <option value="Works in progress">Works in progress</option>
      <option value="Works completed">Works completed</option>
    </select>

    <input type="date" id="startDate">
    <input type="date" id="endDate">
  </div>

  <!-- SUBJECT: Debug Output -->
  <pre id="debug"></pre>

  <!-- SUBJECT: Leaflet Core JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- SUBJECT: Leaflet Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <!-- SUBJECT: Your Main Script -->
  <script>
    // ⭐ MAP INITIALISATION
    const map = L.map('map').setView([51.4, -0.7], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ⭐ LOCATION SEARCH BOX (Correct Placement)
    L.Control.geocoder({
      defaultMarkGeocode: true
    })
    .on('markgeocode', function(e) {
      map.fitBounds(e.geocode.bbox);
    })
    .addTo(map);

    <!-- ⭐ Load your external JS -->
  <script src="script.js"></script>

</body>
</html>
