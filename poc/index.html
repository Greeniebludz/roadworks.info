<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roadworks.info — POC Workspace</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

  <link rel="stylesheet" href="style.css">

  <!-- Prevent indexing -->
  <meta name="robots" content="noindex, nofollow">
</head>

<body>

  <header>
    <h1>Roadworks.info — POC Workspace</h1>
    <p>This page is hidden from the main site. Build freely.</p>
  </header>

  <section id="map-section">
    <div id="map"></div>
  </section>

  <section id="controls">
    <div>
  <label><strong>Start Date:</strong></label>
  <input type="date" id="startDate">

  <label style="margin-left:10px;"><strong>End Date:</strong></label>
  <input type="date" id="endDate">
</div>

    <h2>Controls</h2>

    <label><strong>Filter:</strong></label>
    <select id="statusFilter">
      <option value="">All</option>
      <option value="Planned">Planned</option>
      <option value="Ongoing">Ongoing</option>
      <option value="Completed">Completed</option>
    </select>

    <button id="loadDataBtn">Reload Data</button>
  </section>

  <section id="output">
    <h2>Debug Output</h2>
    <pre id="debug"></pre>
  </section>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <script src="app.js"></script>
  <!--Searchbar-->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

</body>
</html>
