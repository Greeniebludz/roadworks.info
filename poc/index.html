<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadworks Map Viewer</title>

  <!-- Leaflet Core CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Leaflet Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    #controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    #map {
      width: 100%;
      height: 500px;
      background: #ddd;
      border: 2px solid #00A651;
      border-radius: 8px;
      margin-bottom: 20px;
      position: relative;
    }

    button {
      padding: 8px 16px;
      background: #00A651;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #008f45;
    }

    /* Legend */
    #gl-legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
      width: 220px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 9999;
    }

    #gl-legend-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    #gl-legend-header h3 {
      margin: 0;
      font-size: 16px;
    }

    #gl-legend-toggle {
      padding: 4px 10px;
      font-size: 12px;
      background: #eee;
      color: #333;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .legend-section {
      margin-bottom: 12px;
    }

    .legend-section h4 {
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .legend-row {
      display: flex;
      align-items: center;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .legend-colour {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      margin-right: 8px;
      border: 1px solid #ccc;
    }

    #debug {
      font-family: monospace;
      font-size: 11px;
      background: #111;
      color: #0f0;
      padding: 8px;
      height: 120px;
      overflow-y: auto;
      border-radius: 6px;
      white-space: pre;
    }
  </style>
</head>

<body>

  <header>
    <h1>Roadworks.info Map Viewer</h1>
  </header>

  <!-- FILTERS -->
  <div id="controls">
    <button id="loadDataBtn">Reload Data</button>

    <select id="quickRange">
      <option value="today">Today</option>
      <option value="week">This Week</option>
      <option value="month">This Month</option>
    </select>

    <select id="statusFilter">
      <option value="">All Statuses</option>
      <option value="Works in progress">Works in progress</option>
      <option value="Works completed">Works completed</option>
    </select>

    <input type="date" id="startDate">
    <input type="date" id="endDate">
  </div>

  <!-- MAP -->
  <div id="map">
    <div id="gl-legend">
      <div id="gl-legend-header">
        <h3>Legend</h3>
        <button id="gl-legend-toggle">Hide</button>
      </div>

      <div id="gl-legend-body">
        <div class="legend-section">
          <h4>Delay Severity</h4>
          <div class="legend-row">
            <span class="legend-colour" style="background:#00C853"></span> Minimal
          </div>
          <div class="legend-row">
            <span class="legend-colour" style="background:#FFB300"></span> Moderate
          </div>
          <div class="legend-row">
            <span class="legend-colour" style="background:#D50000"></span> Severe
          </div>
          <div class="legend-row">
            <span class="legend-colour" style="background:#9E9E9E"></span> No Delay
          </div>
        </div>

        <div class="legend-section">
          <h4>Traffic Management</h4>
          <div id="tm-legend"></div>
        </div>

        <div class="legend-section">
          <h4>Utility Provider</h4>
          <div id="utility-legend"></div>
        </div>
      </div>
    </div>
  </div>

  <pre id="debug"></pre>

  <!-- Leaflet Core JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Leaflet Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <!-- Leaflet MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <!-- Load GoogleMutant BEFORE any googleMutant calls -->
  <script src="https://unpkg.com/leaflet.gridlayer.googlemutant/Leaflet.GoogleMutant.js"></script>

  <!-- Map Setup -->
  <script>
    // Create map
    const map = L.map('map').setView([51.4, -0.7], 10);

    // Base layer
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ⭐ GOOGLE TRAFFIC LAYER (plugin must be loaded above)
    const googleTraffic = L.gridLayer.googleMutant({
      type: "roadmap"
    });
    googleTraffic.addGoogleLayer("TrafficLayer");
    // Don't add by default; let layer control handle it
    // map.addLayer(googleTraffic); // optional

    // ⭐ HA BOUNDARIES TEST LAYER (replace with real GeoJSON later)
    const haBoundariesLayer = L.layerGroup();

    const testPolygon = {
      "type": "Feature",
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-0.9, 51.5],
          [-0.7, 51.5],
          [-0.7, 51.4],
          [-0.9, 51.4],
          [-0.9, 51.5]
        ]]
      }
    };

    L.geoJSON(testPolygon, {
      style: { color: "#0057B8", weight: 2, fillOpacity: 0.1 }
    }).addTo(haBoundariesLayer);

    // Expose layers globally so script.js can attach them
    window.map = map;
    window.osm = osm;
    window.googleTraffic = googleTraffic;
    window.haBoundariesLayer = haBoundariesLayer;

    // Geocoder
    L.Control.geocoder({
      defaultMarkGeocode: true
    })
    .on('markgeocode', function(e) {
      map.fitBounds(e.geocode.bbox);
    })
    .addTo(map);
  </script>

  <!-- External JS -->
  <script src="script.js"></script>

</body>
</html>
