<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadworks.info Map Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

  <style>
    body { font-family: Arial; margin: 0; padding: 20px; background: #f4f6f8; }
    header { text-align: center; margin-bottom: 20px; }
    #controls { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
    #map { width: 100%; height: 500px; border: 2px solid #00A651; border-radius: 8px; position: relative; }

    #gl-legend {
      position: absolute; bottom: 20px; left: 20px;
      background: white; padding: 12px 16px; border-radius: 8px;
      border: 1px solid #ddd; width: 220px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 9999;
    }

    #gl-legend-header { display: flex; justify-content: space-between; align-items: center; }
    #gl-legend-toggle { padding: 4px 8px; font-size: 12px; border: 1px solid #ccc; background: #eee; cursor: pointer; }

    .legend-section { margin-bottom: 12px; }
    .legend-row { display: flex; align-items: center; margin-bottom: 4px; }
    .legend-colour { width: 16px; height: 16px; border-radius: 4px; margin-right: 8px; border: 1px solid #ccc; }

    #debug { background: #111; color: #0f0; padding: 8px; height: 120px; overflow-y: auto; white-space: pre; }
  </style>
</head>

<body>

<header><h1>Roadworks.info Map</h1></header>

<div id="controls">
  <button id="loadDataBtn">Reload Data</button>
  <select id="quickRange">
    <option value="today">Today</option>
    <option value="week">This Week</option>
    <option value="month">This Month</option>
  </select>
  <select id="statusFilter">
    <option value="">All Statuses</option>
    <option value="Works in progress">Works in progress</option>
    <option value="Works completed">Works completed</option>
  </select>
  <input type="date" id="startDate">
  <input type="date" id="endDate">
</div>

<div id="map">
  <div id="gl-legend">
    <div id="gl-legend-header">
      <h3>Legend</h3>
      <button id="gl-legend-toggle">Hide</button>
    </div>

    <div id="gl-legend-body">
      <div class="legend-section">
        <h4>Delay Severity</h4>
        <div class="legend-row"><span class="legend-colour" style="background:#00C853"></span> Minimal</div>
        <div class="legend-row"><span class="legend-colour" style="background:#FFB300"></span> Moderate</div>
        <div class="legend-row"><span class="legend-colour" style="background:#D50000"></span> Severe</div>
        <div class="legend-row"><span class="legend-colour" style="background:#9E9E9E"></span> No Delay</div>
      </div>

      <div class="legend-section">
        <h4>Traffic Management</h4>
        <div id="tm-legend"></div>
      </div>

      <div class="legend-section">
        <h4>Utility Provider</h4>
        <div id="utility-legend"></div>
      </div>
    </div>
  </div>
</div>

<pre id="debug"></pre>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script src="script.js"></script>

</body>
</html>
