<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>roadworks.info</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      height: 100%;
      width: 100%;
    }

    /* Center title */
    .title-banner {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      z-index: 1000;
      pointer-events: none;
    }

    /* Sidebar container */
    .sidebar {
      position: absolute;
      top: 80px;
      left: 20px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    /* Search bar */
    .search-bar {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .search-bar input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 0.9rem;
    }

    /* Expandable callout */
    .callout {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .callout-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    .callout-body {
      margin-top: 10px;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
    }

    .callout.expanded .callout-body {
      display: block;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="title-banner">
    roadworks.info
  </div>

  <div class="sidebar">
    <div class="search-bar">
      <input type="text" placeholder="Search road, town, or reference…" />
    </div>

    <div class="callout" id="info-callout">
      <div class="callout-header">
        <span>Roadworks overview</span>
        <span id="callout-toggle">▼</span>
      </div>
      <div class="callout-body">
        Live and planned roadworks across the UK.  
        Click on a pin to see details, timings, and affected routes.
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const MAPTILER_KEY = "84APRuB9gcvyT3xzXkKa";

    const map = L.map('map').setView([51.4545, -0.9781], 12);

    L.tileLayer(
      `https://api.maptiler.com/maps/streets/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`,
      {
        attribution: '&copy; MapTiler &copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    // Expandable callout logic
    const callout = document.getElementById('info-callout');
    const toggle = document.getElementById('callout-toggle');

    callout.addEventListener('click', () => {
      const expanded = callout.classList.toggle('expanded');
      toggle.textContent = expanded ? '▲' : '▼';
    });
  </script>
</body>
</html>
