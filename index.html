<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Roadworks POC</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>#map{height:100vh;margin:0}</style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([51.4, -0.7], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Replace with your JSON filename or raw GitHub URL
    const dataUrl = 'sample-roadworks.json';

    fetch(dataUrl)
      .then(r => r.json())
      .then(items => {
        items.forEach(i => {
          L.marker([i.lat, i.lon]).addTo(map)
            .bindPopup(`<b>${i.title}</b><br>${i.start} → ${i.end}<br>${i.status}`);
        });
      })
      .catch(e => console.error('Failed to load data', e));
  </script>
</body>
</html>
