<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>roadworks.info</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+4J08z2vCjXkG8zCwTnU5v5rjXkG8zCwTnU5v5rj0="
    crossorigin=""
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      position: relative;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    /* Center title */
    .title-banner {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      z-index: 1000;
      pointer-events: none;
    }

    /* Left callout + search */
    .sidebar {
      position: absolute;
      top: 80px;
      left: 20px;
      width: 280px;
      max-height: calc(100% - 100px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }

    .search-bar {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .search-bar input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 0.9rem;
    }

    .callout {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .callout-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .callout-body {
      margin-top: 6px;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none; /* collapsed by default */
    }

    .callout.expanded .callout-body {
      display: block;
    }

    .toggle-icon {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <div class="title-banner">
      roadworks.info
    </div>

    <div class="sidebar">
      <div class="search-bar">
        <input type="text" placeholder="Search location, road, or reference…" />
      </div>

      <div class="callout" id="info-callout">
        <div class="callout-header">
          <span>Roadworks overview</span>
          <span class="toggle-icon" id="callout-toggle">▼</span>
        </div>
        <div class="callout-body">
          <p>
            Live and planned roadworks across the UK.  
            Click on a pin to see details, timings, and affected routes.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o9N1j7kGStb6QpGpGv7lCkCmZ1p2QWZ0p6p3p3p3p3="
    crossorigin=""
  ></script>

  <script>
    // Basic Leaflet map
    const map = L.map('map').setView([51.4545, -0.9781], 12); // Reading-ish

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Expandable callout logic
    const callout = document.getElementById('info-callout');
    const toggle = document.getElementById('callout-toggle');

    callout.addEventListener('click', () => {
      const expanded = callout.classList.toggle('expanded');
      toggle.textContent = expanded ? '▲' : '▼';
    });
  </script>
</body>
</html>
